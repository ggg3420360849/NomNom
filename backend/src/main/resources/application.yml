server:
  port: 8080

spring:
  application:
    name: nomnom-backend
  datasource:
    url: jdbc:mysql://localhost:3306/nomnom?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${NOMNOM_JWT_SECRET:nomnom-jwt-secret-key-2026-must-be-at-least-256-bits-long!!}
  expiration: 86400

nomnom:
  upload-path: ${NOMNOM_UPLOAD_PATH:uploads}
