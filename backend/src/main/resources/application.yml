server:
  port: 8080

spring:
  application:
    name: nomnom-backend
  datasource:
    url: ${NOMNOM_DB_URL:jdbc:mysql://localhost:3306/nomnom?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${NOMNOM_DB_USERNAME:root}
    password: ${NOMNOM_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${NOMNOM_JWT_SECRET:nomnom-jwt-secret-key-2026-must-be-at-least-256-bits-long!!}
  expiration: 86400

nomnom:
  upload-path: ${NOMNOM_UPLOAD_PATH:uploads}
